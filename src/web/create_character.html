<!DOCTYPE html>
<html>
<head>
    <title>MagellanWars - Create Character</title>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(to bottom, #000428, #004e92);
            color: #fff;
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.5);
        }
        
        h1 {
            text-align: center;
            font-size: 48px;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #00ffff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 150, 255, 0.8);
        }
        
        .form-section {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #0099ff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .name-input {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            justify-content: center;
        }
        
        .name-input label {
            font-size: 20px;
            color: #00ffff;
        }
        
        .name-input input {
            padding: 10px 15px;
            font-size: 18px;
            border: 2px solid #0099ff;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            width: 300px;
        }
        
        .name-input input:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
    font-size: 18px;
    color: #0ff;
}

.form-group input[type="text"] {
    padding: 10px 20px;
    font-size: 16px;
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid #0099ff;
    color: #fff;
    border-radius: 5px;
    width: 300px;
}

.race-selection {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin: 30px 0;
}

.race-card {
    background: rgba(0, 50, 100, 0.5);
    border: 2px solid #0066cc;
    border-radius: 10px;
    padding: 15px;
    cursor: pointer;
    transition: all 0.3s;
    text-align: center;
}

.race-card:hover {
    background: rgba(0, 100, 200, 0.5);
    border-color: #00aaff;
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0, 150, 255, 0.4);
}

.race-card input[type="radio"] {
    display: none;
}

.race-card.selected {
    background: rgba(0, 150, 255, 0.3);
    border-color: #00ffff;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
}

.race-icon {
    width: 100%;
    height: 120px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    margin-bottom: 10px;
}

.race-name {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 5px;
    color: #fff;
}

.race-desc {
    font-size: 12px;
    color: #aaa;
}

.submit-btn {
    display: block;
    margin: 40px auto 0;
    padding: 15px 50px;
    font-size: 20px;
    background: linear-gradient(45deg, #0066cc, #0099ff);
    color: white;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(0, 150, 255, 0.4);
}

.submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 150, 255, 0.6);
}

.info-text {
    text-align: center;
    color: #999;
    margin-top: 20px;
    font-size: 14px;
}
</style>
</head>
<body>

<div class="container">
    <h1>Create Your Character</h1>
    <p class="subtitle">Choose your race and enter the galaxy</p>
    
    <form method="post" action="create_character_handler.php">
        <div class="form-group">
            <label for="name">Character Name:</label>
            <input type="text" id="name" name="ID" maxlength="30" required placeholder="Enter your character name" pattern="[A-Za-z0-9_-]+" title="3-30 characters, letters, numbers, underscore and hyphen only">
        </div>
        
        <h2 style="text-align: center; color: #0ff;">Select Your Race</h2>
        <p style="text-align: center; color: #999;">Click on any race to select it</p>
        
        <div class="race-selection">
            <label class="race-card" onclick="this.classList.add('selected'); document.querySelectorAll('.race-card').forEach(e => { if(e !== this) e.classList.remove('selected'); });">
                <input type="radio" name="RACE" value="1">
                <div class="race-icon" style="background: linear-gradient(135deg, #667eea, #764ba2);">👤</div>
                <div class="race-name">HUMAN</div>
                <div class="race-desc">Balanced & Versatile</div>
            </label>
            
            <label class="race-card" onclick="this.classList.add('selected'); document.querySelectorAll('.race-card').forEach(e => { if(e !== this) e.classList.remove('selected'); });">
                <input type="radio" name="RACE" value="2">
                <div class="race-icon" style="background: linear-gradient(135deg, #f093fb, #f5576c);">⚔️</div>
                <div class="race-name">TARGRO</div>
                <div class="race-desc">Warrior Race</div>
            </label>
            
            <label class="race-card" onclick="this.classList.add('selected'); document.querySelectorAll('.race-card').forEach(e => { if(e !== this) e.classList.remove('selected'); });">
                <input type="radio" name="RACE" value="3">
                <div class="race-icon" style="background: linear-gradient(135deg, #4facfe, #00f2fe);">💰</div>
                <div class="race-name">BUKKA</div>
                <div class="race-desc">Trade Masters</div>
            </label>
            
            <label class="race-card" onclick="this.classList.add('selected'); document.querySelectorAll('.race-card').forEach(e => { if(e !== this) e.classList.remove('selected'); });">
                <input type="radio" name="RACE" value="4">
                <div class="race-icon" style="background: linear-gradient(135deg, #43e97b, #38f9d7);">🔬</div>
                <div class="race-name">XELOSS</div>
                <div class="race-desc">Tech Specialists</div>
            </label>
            
            <label class="race-card" onclick="this.classList.add('selected'); document.querySelectorAll('.race-card').forEach(e => { if(e !== this) e.classList.remove('selected'); });">
                <input type="radio" name="RACE" value="5">
                <div class="race-icon" style="background: linear-gradient(135deg, #fa709a, #fee140);">📚</div>
                <div class="race-name">AGERUS</div>
                <div class="race-desc">Ancient Wisdom</div>
            </label>
            
            <label class="race-card" onclick="this.classList.add('selected'); document.querySelectorAll('.race-card').forEach(e => { if(e !== this) e.classList.remove('selected'); });">
                <input type="radio" name="RACE" value="6">
                <div class="race-icon" style="background: linear-gradient(135deg, #30cfd0, #330867);">🤝</div>
                <div class="race-name">BOSALIAN</div>
                <div class="race-desc">Diplomatic</div>
            </label>
            
            <label class="race-card" onclick="this.classList.add('selected'); document.querySelectorAll('.race-card').forEach(e => { if(e !== this) e.classList.remove('selected'); });">
                <input type="radio" name="RACE" value="7">
                <div class="race-icon" style="background: linear-gradient(135deg, #a8edea, #fed6e3);">🚀</div>
                <div class="race-name">XELDORADE</div>
                <div class="race-desc">Explorers</div>
            </label>
            
            <label class="race-card" onclick="this.classList.add('selected'); document.querySelectorAll('.race-card').forEach(e => { if(e !== this) e.classList.remove('selected'); });">
                <input type="radio" name="RACE" value="8">
                <div class="race-icon" style="background: linear-gradient(135deg, #ff9a9e, #fecfef);">🐛</div>
                <div class="race-name">KREEN</div>
                <div class="race-desc">Hive Mind</div>
            </label>
            
            <label class="race-card" onclick="this.classList.add('selected'); document.querySelectorAll('.race-card').forEach(e => { if(e !== this) e.classList.remove('selected'); });">
                <input type="radio" name="RACE" value="9">
                <div class="race-icon" style="background: linear-gradient(135deg, #ffecd2, #fcb69f);">🌀</div>
                <div class="race-name">MADNESS</div>
                <div class="race-desc">Chaos Masters</div>
            </label>
            
            <label class="race-card" onclick="this.classList.add('selected'); document.querySelectorAll('.race-card').forEach(e => { if(e !== this) e.classList.remove('selected'); });">
                <input type="radio" name="RACE" value="10">
                <div class="race-icon" style="background: linear-gradient(135deg, #a1c4fd, #c2e9fb);">⭐</div>
                <div class="race-name">MAGELLAN</div>
                <div class="race-desc">Legendary</div>
            </label>
        </div>
        
        <button type="submit" class="submit-btn">Create Character</button>
        
        <p class="info-text">
            Each race has unique strengths and weaknesses.<br>
            Choose wisely as this will affect your entire gameplay experience!
        </p>
    </form>
</div>

<script>
// Auto-focus on name field
document.getElementById('name').focus();

// Validate form
document.querySelector('form').addEventListener('submit', function(e) {
    const name = document.getElementById('name').value.trim();
    const race = document.querySelector('input[name="RACE"]:checked');
    
    if (!name) {
        alert('Please enter a character name!');
        e.preventDefault();
        return false;
    }
    
    if (!race) {
        alert('Please select a race!');
        e.preventDefault();
        return false;
    }
    
    // Form will submit to create_character_handler.php
    return true;
});
</script>

</body>
</html>
