<!DOCTYPE html>
<html>
<head>
    <title>MagellanWars - Login</title>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(to bottom, #000428, #004e92);
            color: #fff;
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
        
        .login-container {
            background: rgba(0, 0, 0, 0.85);
            border-radius: 20px;
            padding: 40px;
            width: 400px;
            box-shadow: 0 0 40px rgba(0, 150, 255, 0.5);
            position: relative;
            z-index: 10;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 42px;
            background: linear-gradient(45deg, #00ffff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 150, 255, 0.8);
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #888;
            font-size: 14px;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #00ffff;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #0066cc;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #00ffff;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }
        
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #0066cc, #0099ff);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0, 150, 255, 0.4);
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 150, 255, 0.6);
        }
        
        .login-btn:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        .links {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #333;
        }
        
        .links a {
            color: #0099ff;
            text-decoration: none;
            margin: 0 10px;
            transition: color 0.3s;
        }
        
        .links a:hover {
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        
        .error-message {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff3333;
            color: #ff6666;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }
        
        .success-message {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #00ff00;
            color: #66ff66;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }
        
        .server-status {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            background: rgba(0, 50, 100, 0.3);
            border-radius: 10px;
        }
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff00;
            margin-right: 5px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="login-container">
        <div class="logo">
            <h1>MagellanWars</h1>
        </div>
        <p class="subtitle">Enter your credentials to access the galaxy</p>
        
        <div class="error-message" id="errorMsg"></div>
        <div class="success-message" id="successMsg"></div>
        
        <form action="login_handler.php" method="POST" id="loginForm">
            <div class="form-group">
                <label for="username">Character Name</label>
                <input type="text" id="username" name="username" required 
                       placeholder="Enter your character name">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required 
                       placeholder="Enter your password">
            </div>
            
            <button type="submit" class="login-btn">ENTER THE GALAXY</button>
        </form>
        
        <div class="links">
            <a href="create_character.html">Create New Character</a>
            <span style="color: #666;">|</span>
            <a href="forgot_password.html">Forgot Password</a>
        </div>
        
        <div class="server-status">
            <span class="status-indicator"></span>
            <span style="color: #888;">Server Status: </span>
            <span style="color: #00ff00;">ONLINE</span>
        </div>
    </div>
    
    <script>
        // Create starfield effect
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }
        
        // Form validation
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            
            if (!username || !password) {
                e.preventDefault();
                errorMsg.textContent = 'Please enter both username and password';
                errorMsg.style.display = 'block';
                return false;
            }
            
            errorMsg.style.display = 'none';
            return true;
        });
        
        // Check for messages in URL params
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('registered') === 'true') {
            const successMsg = document.getElementById('successMsg');
            successMsg.textContent = 'Character created successfully! Please login.';
            successMsg.style.display = 'block';
        }
        
        // Check for error messages
        const error = urlParams.get('error');
        if (error) {
            const errorMsg = document.getElementById('errorMsg');
            switch(error) {
                case 'missing_fields':
                    errorMsg.textContent = 'Please enter both username and password';
                    break;
                case 'invalid_credentials':
                    errorMsg.textContent = 'Invalid username or password. Use "default123" or your character name as password.';
                    break;
                case 'database_error':
                    errorMsg.textContent = 'Database error. Please try again later.';
                    break;
                default:
                    errorMsg.textContent = 'An error occurred. Please try again.';
            }
            errorMsg.style.display = 'block';
        }
    </script>
</body>
</html>
