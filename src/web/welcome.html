<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MagellanWars - Conquer the Galaxy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            color: white;
        }
        
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            max-width: 600px;
            margin: 20px;
        }
        
        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #00ff88, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
        }
        
        .subtitle {
            font-size: 20px;
            color: #b8c6db;
            margin-bottom: 40px;
        }
        
        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            font-weight: bold;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #00ff88, #00d4ff);
            color: #000;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.4);
        }
        
        .btn-secondary {
            background: transparent;
            color: white;
            border: 2px solid #00ff88;
        }
        
        .btn-secondary:hover {
            background: rgba(0, 255, 136, 0.1);
            transform: translateY(-3px);
        }
        
        .features {
            margin-top: 50px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }
        
        .feature {
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        
        .feature-icon {
            font-size: 30px;
            margin-bottom: 10px;
        }
        
        .feature-text {
            font-size: 14px;
            color: #b8c6db;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌌 MagellanWars</h1>
        <p class="subtitle">Build your empire. Command your fleets. Conquer the galaxy.</p>
        
        <div class="buttons">
            <a href="login.html" class="btn btn-primary">Login</a>
            <a href="create_character.html" class="btn btn-secondary">Create Account</a>
        </div>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">🏰</div>
                <div class="feature-text">Build Empires</div>
            </div>
            <div class="feature">
                <div class="feature-icon">⚔️</div>
                <div class="feature-text">Epic Battles</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🤝</div>
                <div class="feature-text">Diplomacy</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🚀</div>
                <div class="feature-text">Space Fleets</div>
            </div>
        </div>
    </div>
</body>
</html>
